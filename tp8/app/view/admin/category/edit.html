<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{$title}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/admin/css/admin.css">
</head>
<body>
    <div class="container-fluid mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4>{$title}</h4>
        </div>
        
        <div class="card">
            <div class="card-body">
                <form method="post" action="/admin/category/update">
                    <input type="hidden" name="id" value="{$info.id}">
                    <div class="form-group row">
                        <label class="col-md-2 col-form-label">分类名称 *</label>
                        <div class="col-md-6">
                            <input type="text" name="name" class="form-control" value="{$info.name}" required>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-md-2 col-form-label">父级分类</label>
                        <div class="col-md-6">
                            <select name="pid" class="form-control">
                                <option value="0">顶级分类</option>
                                {volist name="categories" id="cat"}
                                <option value="{$cat.id}" {eq name="info.pid" value="$cat.id"}selected{/eq}>{$cat.name}</option>
                                {/volist}
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-md-2 col-form-label">排序</label>
                        <div class="col-md-4">
                            <input type="number" name="sort" class="form-control" value="{$info.sort|default=100}">
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-md-6 offset-md-2">
                            <button type="submit" class="btn btn-primary">保存</button>
                            <a href="/admin/category/index" class="btn btn-secondary">返回</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
