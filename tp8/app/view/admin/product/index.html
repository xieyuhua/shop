<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{$title}</title>
    <link rel="stylesheet" href="/static/admin/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/admin/css/admin.css">
</head>
<body>
    <div class="container-fluid mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4>{$title}</h4>
            <a href="/admin/product/add" class="btn btn-primary">
                <i class="fa fa-plus"></i> 添加商品
            </a>
        </div>
        
        <div class="card mb-3">
            <div class="card-body">
                <form method="get" class="form-inline">
                    <select name="category_id" class="form-control mr-2">
                        <option value="">全部分类</option>
                        {volist name="categories" id="cat"}
                        <option value="{$cat.id}">{$cat.name}</option>
                        {/volist}
                    </select>
                    <input type="text" name="keyword" class="form-control mr-2" placeholder="搜索商品...">
                    <select name="status" class="form-control mr-2">
                        <option value="">全部状态</option>
                        <option value="1">上架</option>
                        <option value="0">下架</option>
                    </select>
                    <button type="submit" class="btn btn-primary">搜索</button>
                </form>
            </div>
        </div>
        
        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>商品名称</th>
                            <th>分类</th>
                            <th>价格</th>
                            <th>库存</th>
                            <th>销量</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        {volist name="list.items()" id="item"}
                        <tr>
                            <td>{$item.id}</td>
                            <td>{$item.name}</td>
                            <td>{$item.category_id}</td>
                            <td>￥{$item.price}</td>
                            <td>{$item.stock}</td>
                            <td>{$item.sales}</td>
                            <td>
                                {eq name="item.status" value="1"}
                                <span class="badge badge-success">上架</span>
                                {else/}
                                <span class="badge badge-danger">下架</span>
                                {/eq}
                            </td>
                            <td>
                                <a href="/admin/product/edit?id={$item.id}" class="btn btn-sm btn-primary">编辑</a>
                                <a href="javascript:;" class="btn btn-sm btn-danger" onclick="deleteProduct({$item.id})">删除</a>
                            </td>
                        </tr>
                        {/volist}
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="mt-3">{$list|raw}</div>
    </div>
    
    <script src="/static/admin/js/jquery.min.js"></script>
    <script src="/static/admin/js/bootstrap.min.js"></script>
    <script>
    function deleteProduct(id) {
        if (confirm('确定要删除该商品吗？')) {
            $.post('/admin/product/delete', {id: id}, function(res) {
                if (res.code === 200) location.reload();
                else alert(res.msg);
            });
        }
    }
    </script>
</body>
</html>
