<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{$title}</title>
    <link rel="stylesheet" href="/static/admin/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/admin/css/admin.css">
</head>
<body>
    <div class="container-fluid mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4>{$title}</h4>
            <a href="/admin/product/add" class="btn btn-primary">添加商品</a>
        </div>
        
        <div class="card">
            <div class="card-body">
                <form method="post" action="/admin/product/save" class="form" enctype="multipart/form-data">
                    <div class="form-group row">
                        <label class="col-md-2 col-form-label">商品名称 *</label>
                        <div class="col-md-8">
                            <input type="text" name="name" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-md-2 col-form-label">商品别名</label>
                        <div class="col-md-8">
                            <input type="text" name="slug" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-md-2 col-form-label">商品分类 *</label>
                        <div class="col-md-8">
                            <select name="category_id" class="form-control" required>
                                <option value="">请选择分类</option>
                                {volist name="categories" id="cat"}
                                <option value="{$cat.id}">{$cat.name}</option>
                                {/volist}
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-md-2 col-form-label">销售价格 *</label>
                        <div class="col-md-8">
                            <input type="number" name="price" class="form-control" step="0.01" required>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-md-2 col-form-label">原价</label>
                        <div class="col-md-8">
                            <input type="number" name="original_price" class="form-control" step="0.01">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-md-2 col-form-label">成本价</label>
                        <div class="col-md-8">
                            <input type="number" name="cost_price" class="form-control" step="0.01">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-md-2 col-form-label">库存</label>
                        <div class="col-md-8">
                            <input type="number" name="stock" class="form-control" value="0">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-md-2 col-form-label">商品图片</label>
                        <div class="col-md-8">
                            <input type="text" name="image" class="form-control" placeholder="图片URL">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-md-2 col-form-label">商品描述</label>
                        <div class="col-md-8">
                            <textarea name="description" class="form-control" rows="5"></textarea>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-md-2 col-form-label">是否推荐</label>
                        <div class="col-md-8">
                            <div class="form-check">
                                <input type="checkbox" name="is_recommend" value="1" class="form-check-input">
                                <label class="form-check-label">推荐商品</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-md-8 offset-md-2">
                            <button type="submit" class="btn btn-primary">保存</button>
                            <a href="/admin/product/index" class="btn btn-secondary">返回</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="/static/admin/js/jquery.min.js"></script>
    <script src="/static/admin/js/bootstrap.min.js"></script>
</body>
</html>
