<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{$title} - {$Think.config.site_name|default='商城后台'}</title>
    <link rel="stylesheet" href="/static/admin/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/admin/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/admin/css/admin.css">
</head>
<body>
    <div class="admin-wrapper">
        <nav class="navbar navbar-dark bg-dark navbar-expand-lg fixed-top">
            <a class="navbar-brand" href="/admin">{$Think.config.site_name|default='商城后台'}</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/index/dashboard">控制台</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown">商品管理</a>
                        <div class="dropdown-menu">
                            <a class="dropdown-item" href="/admin/product/index">商品列表</a>
                            <a class="dropdown-item" href="/admin/category/index">商品分类</a>
                        </div>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/order/index">订单管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/user/index">会员管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/config/index">系统配置</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown">
                            <i class="fa fa-user"></i> {$adminInfo.nickname|default=$adminInfo.username}
                        </a>
                        <div class="dropdown-menu dropdown-menu-right">
                            <a class="dropdown-item" href="/admin/login/logout">退出登录</a>
                        </div>
                    </li>
                </ul>
            </div>
        </nav>

        <div class="container-fluid mt-5 pt-4">
            <div class="row">
                <div class="col-md-2">
                    <div class="list-group">
                        <a href="/admin/index/dashboard" class="list-group-item list-group-item-action">
                            <i class="fa fa-dashboard"></i> 控制台
                        </a>
                        <a href="/admin/product/index" class="list-group-item list-group-item-action">
                            <i class="fa fa-cubes"></i> 商品管理
                        </a>
                        <a href="/admin/category/index" class="list-group-item list-group-item-action">
                            <i class="fa fa-tags"></i> ���类管理
                        </a>
                        <a href="/admin/order/index" class="list-group-item list-group-item-action">
                            <i class="fa fa-shopping-cart"></i> 订单管理
                        </a>
                        <a href="/admin/user/index" class="list-group-item list-group-item-action">
                            <i class="fa fa-users"></i> 会员管理
                        </a>
                        <a href="/admin/statistics/index" class="list-group-item list-group-item-action">
                            <i class="fa fa-bar-chart"></i> 数据统计
                        </a>
                        <a href="/admin/config/index" class="list-group-item list-group-item-action">
                            <i class="fa fa-cog"></i> 系统配置
                        </a>
                    </div>
                </div>
                <div class="col-md-10">
                    {__CONTENT__}
                </div>
            </div>
        </div>
    </div>

    <script src="/static/admin/js/jquery.min.js"></script>
    <script src="/static/admin/js/popper.min.js"></script>
    <script src="/static/admin/js/bootstrap.min.js"></script>
    <script src="/static/admin/js/admin.js"></script>
</body>
</html>
