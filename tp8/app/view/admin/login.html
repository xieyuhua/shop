<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{$title}</title>
    <link rel="stylesheet" href="/static/admin/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/admin/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/admin/css/login.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <h3 class="text-center mb-4">{$Think.config.site_name|default='商城后台'}</h3>
            <form id="loginForm">
                <div class="form-group">
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa fa-user"></i></span>
                        </div>
                        <input type="text" class="form-control" name="username" placeholder="用户名" required>
                    </div>
                </div>
                <div class="form-group">
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa fa-lock"></i></span>
                        </div>
                        <input type="password" class="form-control" name="password" placeholder="密码" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">登 录</button>
            </form>
            <div class="text-center mt-3">
                <a href="/">返回商城</a>
            </div>
        </div>
    </div>

    <script src="/static/admin/js/jquery.min.js"></script>
    <script src="/static/admin/js/bootstrap.min.js"></script>
    <script>
    $(function() {
        $('#loginForm').on('submit', function(e) {
            e.preventDefault();
            $.post('/admin/login/login', $(this).serialize(), function(res) {
                if (res.code === 200) {
                    location.href = '/admin/index/dashboard';
                } else {
                    alert(res.msg);
                }
            });
        });
    });
    </script>
</body>
</html>
