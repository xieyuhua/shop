<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{$title}</title>
    <link rel="stylesheet" href="/static/admin/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/admin/css/admin.css">
</head>
<body>
    <div class="container-fluid mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4>{$title}</h4>
            <a href="/admin/user/add" class="btn btn-primary">
                <i class="fa fa-plus"></i> 添加会员
            </a>
        </div>
        
        <div class="card mb-3">
            <div class="card-body">
                <form method="get" class="form-inline">
                    <input type="text" name="keyword" class="form-control mr-2" placeholder="搜索会员..." value="{$keyword|default=''}">
                    <button type="submit" class="btn btn-primary">搜索</button>
                </form>
            </div>
        </div>
        
        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>手机号</th>
                            <th>昵称</th>
                            <th>余额</th>
                            <th>积分</th>
                            <th>状态</th>
                            <th>注册时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        {volist name="list.items()" id="item"}
                        <tr>
                            <td>{$item.id}</td>
                            <td>{$item.mobile}</td>
                            <td>{$item.nickname|default='-'}</td>
                            <td>￥{$item.balance}</td>
                            <td>{$item.points}</td>
                            <td>
                                {eq name="item.status" value="1"}
                                <span class="badge badge-success">正常</span>
                                {else/}
                                <span class="badge badge-danger">禁用</span>
                                {/eq}
                            </td>
                            <td>{$item.create_time}</td>
                            <td>
                                <a href="/admin/user/edit?id={$item.id}" class="btn btn-sm btn-primary">编辑</a>
                                <a href="javascript:;" class="btn btn-sm btn-danger" onclick="deleteUser({$item.id})">删除</a>
                            </td>
                        </tr>
                        {/volist}
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="mt-3">
            {$list|raw}
        </div>
    </div>
    
    <script src="/static/admin/js/jquery.min.js"></script>
    <script src="/static/admin/js/bootstrap.min.js"></script>
    <script>
    function deleteUser(id) {
        if (confirm('确定要删除该会员吗？')) {
            $.post('/admin/user/delete', {id: id}, function(res) {
                if (res.code === 200) {
                    location.reload();
                } else {
                    alert(res.msg);
                }
            });
        }
    }
    </script>
</body>
</html>
